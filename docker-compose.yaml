services:

  # ─── Job de migraciones (1 vez) ────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wilrop-migrate
    restart: "no"
    command: ["migrate"]
    environment: &wilrop_app_env
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      WILROP_ADMIN_EMAIL: ${WILROP_ADMIN_EMAIL:-admin@wilrop.com}
      WILROP_ADMIN_PASSWORD: ${WILROP_ADMIN_PASSWORD:-}
      WILROP_ADMIN_NAME: ${WILROP_ADMIN_NAME:-Administrador WILROP}
      WILROP_ADMIN_RESET_PASSWORD: ${WILROP_ADMIN_RESET_PASSWORD:-false}
    networks:
      - wilrop-net

  # ─── Aplicación Next.js ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wilrop-app
    restart: unless-stopped
    command: ["web"]
    expose:
      - "3000"
    environment: *wilrop_app_env
    volumes:
      - wilrop-uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - wilrop-net
    labels:
      - traefik.enable=true
      # Resolvable backend IP: coolify-proxy only lives on the coolify network.
      - traefik.docker.network=coolify
      # HTTP: permanent redirect to HTTPS (apex + whitelabel subdomains).
      - 'traefik.http.routers.wilrop-http.rule=Host(`wilropgroup.com`) || HostRegexp(`^[a-zA-Z0-9][a-zA-Z0-9-]+[.]wilropgroup[.]com$`)'
      - traefik.http.routers.wilrop-http.entrypoints=http
      - traefik.http.routers.wilrop-http.middlewares=wilrop-redirect
      - traefik.http.routers.wilrop-http.service=wilrop
      - traefik.http.middlewares.wilrop-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.wilrop-redirect.redirectscheme.permanent=true
      # HTTPS: single cert (apex + wildcard) requested via the dnsChallenge resolver.
      - 'traefik.http.routers.wilrop-https.rule=Host(`wilropgroup.com`) || HostRegexp(`^[a-zA-Z0-9][a-zA-Z0-9-]+[.]wilropgroup[.]com$`)'
      - traefik.http.routers.wilrop-https.entrypoints=https
      - traefik.http.routers.wilrop-https.tls=true
      - traefik.http.routers.wilrop-https.tls.certresolver=letsencrypt
      - traefik.http.routers.wilrop-https.tls.domains[0].main=wilropgroup.com
      - traefik.http.routers.wilrop-https.tls.domains[0].sans=*.wilropgroup.com
      - traefik.http.routers.wilrop-https.service=wilrop
      - traefik.http.services.wilrop.loadbalancer.server.port=3000

# ─── Volúmenes ──────────────────────────────────────────────────────────────
volumes:
  wilrop-uploads:
    external: true

# ─── Redes ──────────────────────────────────────────────────────────────────
networks:
  wilrop-net:
    driver: bridge
